<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">Projetos em destaque de Diego Silveira</title>
<desc id="desc">Três cartões em vermelho e preto para os projetos EduTrack, Sistema Escolar e Mural de Avisos.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#211719"/><stop offset="1" stop-color="#120F10"/></linearGradient><linearGradient id="red" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#9F0D18"/><stop offset="1" stop-color="#EF233C"/></linearGradient></defs>
