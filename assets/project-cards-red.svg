<text x="24" y="148" fill="#D7C9CA" font-family="Segoe UI,Arial,sans-serif" font-size="16">Presença, notas, boletins,</text><text x="24" y="172" fill="#D7C9CA" font-family="Segoe UI,Arial,sans-serif" font-size="16">comunicados e calendário.</text>
<path d="M24 198h312" stroke="#563236"/><text x="24" y="226" fill="#FF9BA0" font-family="Consolas,Menlo,monospace" font-size="13">REACT · TYPESCRIPT · EXPRESS</text><text x="24" y="247" fill="#FF9BA0" font-family="Consolas,Menlo,monospace" font-size="13">POSTGRESQL</text>
